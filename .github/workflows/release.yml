name: Release Skills

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Skills
    uses: ./.github/workflows/validate-skills.yml
    permissions:
      contents: read # checkout inside the called workflow

  package:
    name: Package ZIPs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build all-skills.zip and one zip per skill
        run: bash .github/scripts/package_skills.sh "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skills-zips
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skills-zips
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
