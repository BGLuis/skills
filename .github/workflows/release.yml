name: Release Skills

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub release (creates tag and release)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Skills
    uses: ./.github/workflows/validate-skills.yml
    permissions:
      contents: read # checkout inside the called workflow

  package:
    name: Package ZIPs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build all-skills.zip and one zip per skill
        run: bash .github/scripts/package_skills.sh "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skills-zips
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' || inputs.publish != false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skills-zips
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          else
            BASE_TAG="v$(date -u +'%Y.%m.%d')"
            TAG="$BASE_TAG"
            COUNTER=1
            while gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; do
              TAG="${BASE_TAG}.${COUNTER}"
              COUNTER=$((COUNTER + 1))
            done
            gh release create "$TAG" dist/* --target "${{ github.sha }}" --title "$TAG" --generate-notes
          fi
