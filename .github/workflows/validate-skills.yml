name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint and Validate Agent Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Validate SKILL.md Frontmatter and Structure
        run: python3 .github/scripts/validate_skills.py

      - name: Check for broken symlinks
        run: |
          set -e
          ERRORS=0
          for skill_dir in skills/*; do
            if [ -d "$skill_dir" ]; then
              skill_name=$(basename "$skill_dir")
              broken_symlinks=$(find "$skill_dir" -xtype l)
              if [ -n "$broken_symlinks" ]; then
                echo "::error::Skill '$skill_name' contains broken symlinks: $broken_symlinks"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS broken symlink(s)."
            exit 1
          fi
